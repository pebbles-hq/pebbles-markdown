[workspace]
members = [".", "examples/demo"]

[package]
name = "pebbles-markdown"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Reyco Seguma"]
repository = "https://github.com/pebbles-hq/pebbles-markdown"
homepage = "https://github.com/pebbles-hq/pebbles-markdown"
description = "Live Markdown (GFM) reader + editor widget for the Pebbles GUI framework — renders Markdown to native, themed widgets and rewrites the bound source on interaction. Part of the Pebbles ecosystem."
keywords = ["gui", "markdown", "pebbles", "widget", "gfm"]
categories = ["gui"]
readme = "README.md"

[features]
default = []
# Render inline images through Pebbles' ImageView (pulls the image codecs +,
# for network URLs, a blocking HTTP client). Without it, images show alt text.
image-view = ["pebbles-widgets/image-view"]

# Pebbles is the host framework. These are PATH dependencies for local
# side-by-side development (clone `pebbles` and `pebbles-markdown` as siblings
# under one directory). An external consumer instead points at the published
# framework by git — see the README's "Depending on Pebbles" section:
#
#   pebbles-widgets   = { git = "https://github.com/pebbles-hq/pebbles" }
#   pebbles-core      = { git = "https://github.com/pebbles-hq/pebbles" }
#   pebbles-render    = { git = "https://github.com/pebbles-hq/pebbles" }
#   pebbles-foundation = { git = "https://github.com/pebbles-hq/pebbles" }
[dependencies]
pebbles-core = { path = "../pebbles/crates/pebbles-core" }
pebbles-render = { path = "../pebbles/crates/pebbles-render" }
pebbles-foundation = { path = "../pebbles/crates/pebbles-foundation" }
pebbles-widgets = { path = "../pebbles/crates/pebbles-widgets" }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# The runnable showcase lives in its own workspace member (`examples/demo`) so it
# can pull the `pebbles` umbrella + the headless-capture stack without adding them
# to the library's dependency graph. Run it with `cargo run -p demo`.

# Dev builds keep THIS crate at opt-level 0 (fast incremental compiles) but
# optimize every dependency — the framework, wgpu/vello (GPU), parley/swash (text
# shaping + rasterization) — at opt-level 2. Without this, `cargo run -p demo`
# and `cargo test` shape/paint text unoptimized and lag badly on real documents.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
