[package]
name = "demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
# Path deps for local side-by-side development (clone `pebbles` as a sibling of
# `pebbles-markdown`). Mirrors the main crate's dependency posture.
pebbles = { path = "../../../pebbles/crates/pebbles", default-features = false }
pebbles-markdown = { path = "../..", default-features = false }

[features]
default = ["vello-hybrid"]
vello-hybrid = ["pebbles/vello-hybrid", "pebbles-markdown/vello-hybrid"]
wgpu = ["pebbles/wgpu", "pebbles-markdown/wgpu"]
