name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · doc
    runs-on: ubuntu-latest
    steps:
      # The crate depends on the framework by PATH (`../pebbles/crates/*`), so the
      # two repos must sit side by side — check this repo into `pebbles-markdown/`
      # and clone `pebbles` next to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pebbles-markdown

      - name: Clone the Pebbles framework (sibling)
        run: git clone --depth 1 https://github.com/pebbles-hq/pebbles pebbles

      # The `image-view` feature (exercised by `--all-features`) pulls
      # fontconfig-sys for system font discovery, whose build script needs the
      # fontconfig dev headers.
      - name: System deps (fontconfig, for the image-view feature)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: pebbles-markdown

      - name: Format
        working-directory: pebbles-markdown
        run: cargo fmt --all --check

      - name: Clippy (all targets + features, warnings = errors)
        working-directory: pebbles-markdown
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        # The rendering/robustness/storm suites run headless on CPU. The SHOT=
        # screenshot path needs a GPU and isn't exercised here.
        working-directory: pebbles-markdown
        run: cargo test --workspace --all-features

      - name: Docs
        working-directory: pebbles-markdown
        run: cargo doc --no-deps --workspace --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
